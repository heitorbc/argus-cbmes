packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  puppeteer: set this to true or false

# pnpm 11 exige aprovação explícita de scripts pós-install.
# Lista de dependências cujos build scripts são confiáveis.
onlyBuiltDependencies:
  - esbuild
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - puppeteer
  - puppeteer
